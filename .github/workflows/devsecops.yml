name: DevSecOps Shift Left Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  iac-scan:
    name: IaC Scan - Checkov
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Checkov Terraform scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/tf" \
            bridgecrew/checkov:latest \
            -d /tf/infrastructure \
            --framework terraform \
            --check CKV_AWS_24 \
            --compact

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: iac-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          pull: true
          tags: devsecops-demo:${{ github.sha }}

      - name: Verify Docker image
        run: |
          docker image inspect devsecops-demo:${{ github.sha }}
          docker images devsecops-demo

      - name: Save Docker image
        run: |
          docker save \
            -o devsecops-image.tar \
            devsecops-demo:${{ github.sha }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: devsecops-image.tar
          retention-days: 1

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: devsecops-image.tar
          scan-type: image
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

  security-gate:
    name: Security Gate - Passed
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - name: Confirm all security checks
        run: |
          echo "All required DevSecOps security checks passed."
          echo "Gitleaks: PASSED"
          echo "Checkov: PASSED"
          echo "Docker Build: PASSED"
          echo "Trivy: PASSED"
          echo "Security Gate: OPEN"